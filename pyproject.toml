[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smerisk"
dynamic = ["version"]
description = "Open-source Python library for probabilistic management control in SMEs: payroll at risk, cash-flow at risk (CFaR), credibility-weighted rates, fixed-price project risk, receivables risk and Benford audits."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "payroll at risk",
    "cash flow at risk",
    "cfar",
    "monte carlo",
    "risk management",
    "management control",
    "fp&a",
    "actuarial",
    "credibility",
    "benford",
    "fec",
    "sme",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://oussamaelguerraoui.github.io/smerisk/"
Source = "https://github.com/OussamaELGUERRAOUI/smerisk"
Documentation = "https://oussamaelguerraoui.github.io/smerisk/"
Changelog = "https://github.com/OussamaELGUERRAOUI/smerisk/blob/main/CHANGELOG.md"
Issues = "https://github.com/OussamaELGUERRAOUI/smerisk/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx2",
    "smerisk-service",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[tool.hatch.version]
path = "src/smerisk/_version.py"

[tool.hatch.build.targets.sdist]
# The library only: the service and the CI configuration are not part of the package.
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]
exclude = ["/tests/service"]

[tool.hatch.build.targets.wheel]
packages = ["src/smerisk"]

[tool.uv]
# Rebuild the package when the version changes (it is read from _version.py, not from pyproject.toml).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/smerisk/_version.py" }]

[tool.uv.workspace]
members = ["service"]

[tool.uv.sources]
smerisk-service = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["smerisk", "smerisk_service"]
branch = true

[tool.mypy]
strict = true
packages = ["smerisk", "smerisk_service"]
mypy_path = ["src", "service"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["smerisk", "smerisk_service"]
