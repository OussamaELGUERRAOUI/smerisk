name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Generate the OpenAPI contract
        if: matrix.python-version == '3.13'
        run: uv run python -m smerisk_service.openapi openapi.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: openapi
          path: openapi.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --only-group docs
      - run: uv run --only-group docs mkdocs build --strict
